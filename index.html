<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, Arial;
        background: #0e050b;
        color: #e8eef4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      header {
        padding: 2rem 1.5rem 1rem;
        max-width: 1080px;
        margin: 0 auto;
      }

      .page-title {
        font-size: clamp(2.1rem, 3vw, 3.4rem);
        margin: 0 0 0.5rem;
        letter-spacing: -0.03em;
      }

      .intro {
        margin: 0;
        color: #ffffff;
        line-height: 1.85;
        max-width: 40rem;
      }

      main {
        max-width: 1080px;
        margin: 0 auto 3rem;
        padding: 0 1.5rem;
      }

      .year-block {
        margin-top: 2.5rem;
      }

      .year-title {
        font-size: 1.25rem;
        margin: 0 0 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: #ffffff;
      }

      .year-title::before {
        content: "";
        width: 0.35rem;
        height: 0.35rem;
        border-radius: 100%;
        background: #ffffff;
      }

      .work-list {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      }

      .work-card {
        display: block;
        border-radius: 0.1rem;
        overflow: hidden;
        text-decoration: none;
        background: linear-gradient(180deg, rgba(18, 28, 43, 0.95), rgba(8, 13, 22, 0.95));
        border: 1px solid rgba(132, 151, 182, 0.12);
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        max-width: 500px;
        min-width: 180px;
      }

      .work-card:hover,
      .work-card:focus-visible {
        transform: translateY(-1px);
        border-color: rgb(255, 255, 255);
        box-shadow: 0 20px 60px rgb(0, 0, 0);
      }

      .thumbnail {
        position: relative;
        height: 180px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 1rem;
        background-size: cover;
        background-position: center;
      }

      .work-copy {
        padding: 1.2rem;
      }

      .work-title {
        margin: 0 0 0.5rem;
        font-size: 1.05rem;
        line-height: 1.35;
        color: #f7fbff;
      }

      .work-description {
        margin: 0;
        color: #b8c3d7;
        line-height: 1.7;
        font-size: 0.95rem;
      }

      .scroll-note {
        margin: 1rem 0 0;
        color: #7b8ba4;
        font-size: 0.92rem;
      }

      @media (max-width: 320px) {
        .thumbnail {
          height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="page-title">Everything I Made</h1>
      <p class="intro">This little website showcases most of my work. Even the cringy ones.</p>
    </header>

    <main id="work-feed"></main>

    <script>
      const workByYear = [
        {
          year: "Currently",
          items: [
            {
              title: "Telekill",
              thumbnail: "Images/ssTelekill.png",
              description: "The game im currently working on. A one-hit-kill 2D action platformer. Kind of a mix of Hotline Miami and Katana ZERO",
              link: "Articles/Telekill.html"
            }
          ]
        },
        {
          year: 2026,
          items: [
            {
              title: "Topdown Rogulike Demo",
              thumbnail: "Images/ssHades3.png",
              description: "A topdown roguelike demo inspired by Hades. Made in ~2 weeks.",
              link: "https://drive.google.com/drive/folders/1TgiT7IFuS9zeQTMbataxxUs3lhdTdcxF?usp=drive_link"
            },
            {
              title: "Artemis Links",
              thumbnail: "Images/ssArtemisLinks.png",
              description: "A collection of links to use in computer class. Made in a day.",
              link: "https://artemislinks.netlify.app"
            }
          ]
        },
        {
          year: 2025,
          items: [
            {
              title: "Noobcraft",
              thumbnail: "https://img.itch.zone/aW1nLzE2NTU0MjIxLnBuZw==/315x250%23c/wDqczl.png",
              description: "My first multiplayer game that started off as something simple in 2023 and became a (kinda) original mobile battle royale game and is actually fun.",
              link: "https://mesj55.itch.io/noobcraft"
            },
            {
              title: "Malorant",
              thumbnail: "Articles/Images/imageMalorant1.png",
              description: "Another attempt to make a Counter Strike clone. This time with 2 additional years of experience I managed to pull of something decent. Made in ~10 days. Also multiplayer using Steam.",
              link: "Articles/Malorant.html"
            },
            {
              title: "Shotgun Roulette",
              thumbnail: "Images/ssShotgunRoulette.png",
              description: "A buckshot roulette clone playable on a single device with up to 4 players. Made in 3 days.",
              link: "https://mesj55.itch.io/shotgunroulette"
            },
            {
              title: "Blender Stuff",
              thumbnail: "Images/ssModelShowcase.png",
              description: "Some basic stuff i did with blender and a showcase of my first decent 3D model.",
              link: "Articles/BlenderStuff.html"
            }
          ]
        },
        {
          year: 2024,
          items: [
            {
              title: "Wet Floor Sign Boss Fight",
              thumbnail: "Images/ssSlip.png",
              description: "I think the title is descriptive enough. " +
              "Made in a day.",
              link: "https://mesj55.itch.io/slip"
            },
            {
              title: "The Mango Game",
              thumbnail: "Articles/Images/imageMango1.png",
              description: "A multiplayer deathmatch game where you propel yourself and shoot others with a MANGO gun. " +
              "Made in ~4 days at the TÜBİTAK summer camp.",
              link: "Articles/MangoGame.html"
            },
            {
              title: "Korku Sucuğu",
              thumbnail: "Images/ssKorkuSucugu.png",
              description: "A multiplayer hide and seek game where one player is the monster who tries to catch everyone." +
              "While the others try to survive using various items they find.",
              link: "https://mesj55.itch.io/korku-sucuu"
            },
            {
              title: "NoClip",
              thumbnail: "https://img.itch.zone/aW1nLzE2Njc0NTM0LnBuZw==/315x250%23c/Gvz1bX.png",
              description: "A platformer made in 2 days for the ScoreSpace Jam #30. The theme was float. And you can noclip through walls in the game.",
              link: "https://mesj55.itch.io/noclip"
            }
          ]
        },
        {
          year: 2023,
          items: [
            {
              title: "Çalorant",
              thumbnail: "Images/ssCalorant.png",
              description: "A miserable attempt to make a Counter Strike clone. The name comes from \"Çal-\"(to steal) and Valorant.",
              link: "https://drive.google.com/drive/folders/1Cgp438Kd1SGOP8b45I3VVrGSWdTJW3MB?usp=sharing"
            }
          ]
        },
        {
          year: "Ancient Times",
          items: [
            {
              title: "My Scratch",
              thumbnail: "https://cdn2.scratch.mit.edu/get_image/project/781659319_100x80.png",
              description: "My old Scratch projects. About 10 of them. I appreciate the effort but they're not pretty good.",
              link: "https://scratch.mit.edu/users/SmS55tr/"
            }
          ]
        }
      ];

      const feed = document.getElementById('work-feed');

      function createCard(item) {
        const card = document.createElement('a');
        card.className = 'work-card';
        card.href = item.link;

        const thumb = document.createElement('div');
        thumb.className = 'thumbnail';
        thumb.style.backgroundImage = `url("${item.thumbnail}")`;

        const label = document.createElement('span');
        label.className = 'thumb-label';
        label.textContent = item.label;
        thumb.appendChild(label);

        const copy = document.createElement('div');
        copy.className = 'work-copy';

        const title = document.createElement('h2');
        title.className = 'work-title';
        title.textContent = item.title;

        const description = document.createElement('p');
        description.className = 'work-description';
        description.textContent = item.description;

        copy.appendChild(title);
        copy.appendChild(description);

        card.appendChild(thumb);
        card.appendChild(copy);
        return card;
      }

      function renderWorkFeed() {
        workByYear.forEach(section => {
          const block = document.createElement('section');
          block.className = 'year-block';

          const heading = document.createElement('h2');
          heading.className = 'year-title';
          heading.textContent = section.year;

          const list = document.createElement('div');
          list.className = 'work-list';

          section.items.forEach(item => {
            list.appendChild(createCard(item));
          });

          block.appendChild(heading);
          block.appendChild(list);
          feed.appendChild(block);
        });

        const note = document.createElement('p');
        note.className = 'scroll-note';
        note.innerHTML = 'btw you should probably <a href=https://politeandgood.com>read this</a>';
        feed.appendChild(note);
      }

      renderWorkFeed();
    </script>
  </body>
</html>
